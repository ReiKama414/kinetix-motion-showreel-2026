      function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        const num = parseInt(clean, 16);
        return [
          ((num >> 16) & 255) / 255,
          ((num >> 8) & 255) / 255,

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function smoothstep(edge0, edge1, x) {
        const t = clamp((x - edge0) / (edge1 - edge0), 0.0, 1.0);
        return t * t * (3.0 - 2.0 * t);

      function formatTimecode(sec) {

        const frames = Math.floor((clamped - wholeSec) * FPS);
        const sStr = String(wholeSec).padStart(2, '0');

      // =========================================================================
      // 2. WEB AUDIO API PROCEDURAL 128-BPM SOUNDTRACK ENGINE
      // =========================================================================
      class ProceduralAudioEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.streamDest = null;
          this.enabled = false;
          this.lastBeatIndex = -1;
          this.lastSixteenthIndex = -1;
          this.lastActIndex = -1;
        }

        init() {
          if (this.ctx) {
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.32;
          this.masterGain.connect(this.ctx.destination);

          if (this.ctx.createMediaStreamDestination) {
            this.streamDest = this.ctx.createMediaStreamDestination();
            this.masterGain.connect(this.streamDest);
          }
        }

        setEnabled(val) {
          this.enabled = val;
          if (val) {
            this.init();
          }
        }

        getAudioTrack() {
          if (!this.ctx) this.init();
          if (this.streamDest && this.streamDest.stream) {
            const tracks = this.streamDest.stream.getAudioTracks();
            return tracks.length > 0 ? tracks[0] : null;
          }
          return null;
        }

        triggerKick(now, intensity) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(135 * intensity, now);
          osc.frequency.exponentialRampToValueAtTime(34, now + 0.14);
          osc.frequency.exponentialRampToValueAtTime(24, now + 0.32);

          gain.gain.setValueAtTime(0.75 * intensity, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.35);
        }

        triggerHat(now, accent) {
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.045);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 6800;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(accent ? 0.18 : 0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          noise.start(now);
        }

        triggerSynthBass(now, freq, duration, cutoff) {
          const osc = this.ctx.createOscillator();
          const sub = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);

          sub.type = 'triangle';
          sub.frequency.setValueAtTime(freq * 0.5, now);

          filter.type = 'lowpass';
          filter.Q.value = 5.5;
          filter.frequency.setValueAtTime(cutoff, now);
          filter.frequency.exponentialRampToValueAtTime(140, now + duration * 0.9);

          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(filter);
          sub.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          osc.start(now);
          sub.start(now);
          osc.stop(now + duration);
          sub.stop(now + duration);
        }

        triggerTransitionWhoosh(now, actIdx) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const chords = [130.81, 174.61, 207.65, 196.0, 261.63];
          const baseFreq = chords[actIdx % chords.length];

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(baseFreq * 0.5, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.0, now + 0.28);
          osc.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.65);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.28, now + 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.72);
        }

        update(time, isPlaying) {
          if (!this.enabled || !isPlaying || !this.ctx) return;
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }

          const now = this.ctx.currentTime;
          const beatIdx = Math.floor(time / BEAT_INTERVAL);
          const sixteenthIdx = Math.floor(time / (BEAT_INTERVAL * 0.25));
          const actIdx = Math.min(4, Math.floor(time / 3.0));

          if (actIdx !== this.lastActIndex) {
            this.lastActIndex = actIdx;
            this.triggerTransitionWhoosh(now, actIdx);
          }

          if (beatIdx !== this.lastBeatIndex) {
            this.lastBeatIndex = beatIdx;
            this.triggerKick(now, (beatIdx % 4 === 0) ? 1.15 : 0.92);
          }

          if (sixteenthIdx !== this.lastSixteenthIndex) {
            this.lastSixteenthIndex = sixteenthIdx;
            const step = sixteenthIdx % 16;
            if (step % 2 === 1) {
              this.triggerHat(now, step % 4 === 2);
            }
            const scaleByAct = [
              [65.41, 77.78, 98.0, 116.54],
              [87.31, 103.83, 130.81, 155.56],
              [103.83, 130.81, 155.56, 196.0],
              [98.0, 116.54, 146.83, 174.61],
              [130.81, 155.56, 196.0, 261.63]
            ];
            const notes = scaleByAct[actIdx];
            if (step === 0 || step === 3 || step === 6 || step === 10 || step === 12 || step === 14) {
              const note = notes[(step + beatIdx) % notes.length];
              const cutoff = 900 + actIdx * 380 + (step % 4 === 0 ? 800 : 200);

      // =========================================================================
      // 3. CUSTOM GLSL SHADERS (100% GLSL ES 1.00 / WEBGL 1 & 2 SAFE)
      // =========================================================================
      const FLUID_BG_VERTEX = `
        varying vec2 vUv;

      const FLUID_BG_FRAGMENT = `
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        uniform float uBeatPulse;
        uniform float uTransitionSurge;
        uniform vec3 uColorBgA;
        uniform vec3 uColorBgB;
        uniform vec3 uColorAccent1;
        uniform vec3 uColorAccent2;

        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 rot = mat2(0.8, -0.6, 0.6, 0.8);
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p = rot * p * 2.02 + vec2(1.7, 9.2);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 uv = vUv * 2.0 - 1.0;
          uv.x *= 1.7778;

          float dist = length(uv);

          // Fluid domain warping with transition surge wave
          vec2 warpUv = uv * (1.15 - uTransitionSurge * 0.25);
          float t = uTime * 0.55;

          vec2 q = vec2(
            fbm(warpUv + vec2(0.0, t * 0.4)),
            fbm(warpUv + vec2(5.2, 1.3 - t * 0.35))
          );

          vec2 r = vec2(
            fbm(warpUv + 3.2 * q + vec2(1.7, 9.2) + 0.25 * t),
            fbm(warpUv + 3.2 * q + vec2(8.3, 2.8) - 0.2 * t)
          );

          float f = fbm(warpUv + r * (1.6 + uTransitionSurge * 1.4));

          // Radial shockwave rings on beat and act transitions
          float transitionWave = exp(-abs(dist - uTransitionSurge * 2.1) * 4.5) * uTransitionSurge;

          vec3 col = mix(uColorBgA, uColorBgB, clamp(f * f * 1.8, 0.0, 1.0));
          col = mix(col, uColorAccent1, clamp(length(q) * 0.26 * (0.4 + uBeatPulse * 0.6), 0.0, 0.35));
          col = mix(col, uColorAccent2, clamp(r.y * r.x * 0.32 + transitionWave * 0.55, 0.0, 0.48));

          // Pure GLSL ES 1.00 warped architectural grid lines
          vec2 gUv = uv * 3.5 + r * 0.18;
          float gx = smoothstep(0.96, 0.995, cos(gUv.x * 6.28318));
          float gy = smoothstep(0.96, 0.995, cos(gUv.y * 6.28318));
          float gridMask = max(gx, gy) * 0.055 * (1.0 + uBeatPulse * 0.6);
          col += gridMask * uColorAccent1;

          // Center volumetric glow + cinematic vignette
          float centerGlow = exp(-dist * 1.65) * (0.24 + uBeatPulse * 0.15);
          col += centerGlow * mix(uColorAccent1, uColorAccent2, 0.5);

          float vig = smoothstep(2.15, 0.35, dist);
          col *= vig;

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      // 4D Parametric Surface Vertex & Fragment Shader for the Morphing Sculpture

        precision highp float;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        varying float vDisplacement;

        uniform float uTime;
        uniform float uActMorph;     // 0.0 -> 5.0 continuous across 5 acts
        uniform float uBeatPulse;
        uniform float uLiquidFactor; // Peaks in Act IV

        const float PI = 3.14159265359;

        float myCosh(float x) {
          return 0.5 * (exp(x) + exp(-x));
        }

        // State 0: Faceted Crystalline Singularity Poly-Sphere (Act I)
        vec3 shapeSingularity(vec2 uv, float t) {
          float u = uv.x * 2.0 * PI;
          float v = uv.y * PI;
          float r = 2.05 + 0.28 * cos(6.0 * u) * sin(5.0 * v) + 0.12 * sin(12.0 * u + t * 3.0);
          return vec3(
            r * sin(v) * cos(u),
            r * sin(v) * sin(u),
            r * cos(v)
          );
        }

        // State 1: Twisted Trefoil Torus Knot Ribbon Sculpture (Act II)
        vec3 shapeTorusKnot(vec2 uv, float t) {
          float u = uv.x * 2.0 * PI;
          float v = uv.y * 2.0 * PI;
          float p = 2.0;
          float q = 3.0;
          float r = 1.45 + 0.55 * cos(q * u);
          vec3 center = vec3(
            r * cos(p * u),
            r * sin(p * u),
            0.75 * sin(q * u)
          );
          vec3 tangent = normalize(vec3(
            -p * r * sin(p * u) - 0.55 * q * sin(q * u) * cos(p * u),
            p * r * cos(p * u) - 0.55 * q * sin(q * u) * sin(p * u),
            0.75 * q * cos(q * u)
          ));
          vec3 normal = normalize(cross(tangent, vec3(0.0, 0.0, 1.0) + vec3(0.01, 0.01, 0.0)));
          vec3 binormal = normalize(cross(tangent, normal));
          float tubeRadius = 0.52 + 0.14 * sin(8.0 * v + u * 3.0 + t * 4.0);
          return center + tubeRadius * (normal * cos(v) + binormal * sin(v));
        }

        // State 2: Hyperbolic Vortex Funnel & Ribbed Matrix Core (Act III)
        vec3 shapeVortexCore(vec2 uv, float t) {
          float u = uv.x * 2.0 * PI;
          float v = (uv.y - 0.5) * 2.0;
          float twist = v * 4.2 + t * 2.0;
          float rad = 1.35 * myCosh(v * 0.95) + 0.25 * sin(8.0 * u + twist);
          return vec3(
            rad * cos(u + twist * 0.35),
            rad * sin(u + twist * 0.35),
            v * 2.35 + 0.2 * cos(6.0 * u)
          );
        }

        // State 3: Ferrofluid Liquid Metal Crown (Act IV)
        vec3 shapeFerrofluid(vec2 uv, float t) {
          float u = uv.x * 2.0 * PI;
          float v = uv.y * PI;
          float spikes = sin(7.0 * u + t * 3.2) * sin(7.0 * v - t * 2.4)
                       + 0.6 * cos(11.0 * u - t * 4.0) * sin(9.0 * v + t * 2.8);
          float r = 1.95 + (0.62 + uBeatPulse * 0.28) * spikes;
          return vec3(
            r * sin(v) * cos(u),
            r * sin(v) * sin(u),
            r * cos(v)
          );
        }

        // State 4: Sacred Astroidal Harmonic Emblem (Act V)
        vec3 shapeSacredEmblem(vec2 uv, float t) {
          float u = uv.x * 2.0 * PI;
          float v = (uv.y - 0.5) * PI;
          float cu = cos(u);
          float su = sin(u);
          float cv = cos(v);
          float sv = sin(v);
          vec3 astroid = vec3(
            2.45 * cu * cu * cu * cv * cv * cv,
            2.45 * su * su * su * cv * cv * cv,
            2.45 * sv * sv * sv
          );
          vec3 sphere = vec3(
            2.1 * cos(v) * cos(u),
            2.1 * cos(v) * sin(u),
            2.1 * sin(v)
          );
          return mix(astroid, sphere, 0.42 + 0.15 * sin(8.0 * u + t * 3.0));
        }

        vec3 evalMorphPos(vec2 uv, float morph, float t) {
          vec3 s0 = shapeSingularity(uv, t);
          vec3 s1 = shapeTorusKnot(uv, t);
          vec3 s2 = shapeVortexCore(uv, t);
          vec3 s3 = shapeFerrofluid(uv, t);
          vec3 s4 = shapeSacredEmblem(uv, t);

          if (morph < 1.0) {
            return mix(s0, s1, smoothstep(0.0, 1.0, morph));
          } else if (morph < 2.0) {
            return mix(s1, s2, smoothstep(1.0, 2.0, morph));
          } else if (morph < 3.0) {
            return mix(s2, s3, smoothstep(2.0, 3.0, morph));
          } else if (morph < 4.0) {
            return mix(s3, s4, smoothstep(3.0, 4.0, morph));
          } else {
            return mix(s4, s0, smoothstep(4.0, 5.0, morph));
          }
        }

        void main() {
          vUv = uv;
          float eps = 0.004;
          vec3 pos = evalMorphPos(uv, uActMorph, uTime);
          vec3 posU = evalMorphPos(uv + vec2(eps, 0.0), uActMorph, uTime);
          vec3 posV = evalMorphPos(uv + vec2(0.0, eps), uActMorph, uTime);

          vec3 tangentU = posU - pos;
          vec3 tangentV = posV - pos;
          vec3 calcNormal = normalize(cross(tangentU, tangentV) + vec3(0.0001));

          // Beat-synced harmonic ripple along surface normal
          float wave = sin(uv.x * 25.1327 + uTime * 6.0) * cos(uv.y * 18.8495 - uTime * 4.5);
          float disp = wave * (0.06 + uBeatPulse * 0.12 + uLiquidFactor * 0.09);
          pos += calcNormal * disp;
          vDisplacement = disp;

          vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
          vWorldPos = worldPosition.xyz;
          vNormal = normalize(normalMatrix * calcNormal);
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `;

      const CORE_MORPH_FRAGMENT = `
        precision highp float;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        varying float vDisplacement;

        uniform float uTime;
        uniform float uBeatPulse;
        uniform vec3 uColorAccent1;
        uniform vec3 uColorAccent2;
        uniform vec3 uColorAccent3;
        uniform float uLiquidFactor;

        void main() {
          vec3 N = normalize(vNormal);
          vec3 V = normalize(cameraPosition - vWorldPos);

          // Studio 3-point lighting vectors
          vec3 L1 = normalize(vec3(6.0, 8.0, 7.0));
          vec3 L2 = normalize(vec3(-7.0, -4.0, 5.0));

          float diff1 = max(dot(N, L1), 0.0);
          float diff2 = max(dot(N, L2), 0.0);

          vec3 H1 = normalize(L1 + V);
          vec3 H2 = normalize(L2 + V);
          float specPower = mix(42.0, 110.0, uLiquidFactor);
          float spec1 = pow(max(dot(N, H1), 0.0), specPower);
          float spec2 = pow(max(dot(N, H2), 0.0), specPower * 0.7);

          // Fresnel Rim & Iridescent Thin-Film Interference
          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.6);
          vec3 refl = reflect(-V, N);
          float envBand = 0.5 + 0.5 * sin(refl.y * 7.0 + refl.x * 4.0 + uTime * 2.5);

          vec3 baseMetal = mix(vec3(0.06, 0.07, 0.11), vec3(0.18, 0.2, 0.26), envBand);
          vec3 iridescence = mix(uColorAccent1, uColorAccent2, 0.5 + 0.5 * sin(fresnel * 6.28 + uTime * 2.0 + vUv.x * 6.28));

          vec3 color = baseMetal;
          color += diff1 * uColorAccent1 * 0.52;
          color += diff2 * uColorAccent2 * 0.45;
          color += fresnel * iridescence * (1.25 + uBeatPulse * 0.55);
          color += spec1 * uColorAccent3 * 1.15;
          color += spec2 * uColorAccent1 * 0.65;

          // Subtle energy vein lines across parametric UV grid
          float uLine = smoothstep(0.94, 0.99, abs(sin(vUv.x * 3.14159 * 24.0)));
          float vLine = smoothstep(0.94, 0.99, abs(sin(vUv.y * 3.14159 * 24.0)));
          float vein = max(uLine, vLine) * (1.0 - uLiquidFactor * 0.65);
          color += vein * mix(uColorAccent1, uColorAccent2, vUv.y) * (0.28 + uBeatPulse * 0.42);

          // Displacement crest glow
          color += clamp(vDisplacement * 4.5, 0.0, 1.0) * uColorAccent1 * 0.5;

          gl_FragColor = vec4(color, 1.0);
        }
      `;

      // GPU Particle Swarm Vertex & Fragment Shader (12,000 Particles with Bokeh DoF)
      const PARTICLE_VERTEX = `
        precision highp float;
        attribute vec3 aSeed;
        attribute vec3 aOrbit;
        attribute float aScale;

        varying vec3 vColor;
        varying float vAlpha;

        uniform float uTime;
        uniform float uActMorph;
        uniform float uBeatPulse;
        uniform vec3 uColorAccent1;
        uniform vec3 uColorAccent2;
        uniform vec3 uColorAccent3;

        const float PI = 3.14159265359;

        void main() {
          float u = aSeed.y * 2.0 * PI;
          float v = (aSeed.z - 0.5) * 2.0;

          // Act I: Imploding/Exploding Singularity Accretion Shell
          float r1 = 2.8 + 4.8 * fract(aOrbit.x + uTime * 0.22);
          float theta1 = u + uTime * (0.8 + aOrbit.y * 1.2);
          float phi1 = acos(clamp(v, -0.99, 0.99));
          vec3 p1 = vec3(
            r1 * sin(phi1) * cos(theta1),
            r1 * sin(phi1) * sin(theta1) * 0.65,
            r1 * cos(phi1)
          );

          // Act II: Double-Helix Parametric Torus Flow
          float t2 = u + uTime * 0.9;
          float r2 = 2.9 + 1.1 * cos(3.0 * t2);
          vec3 p2 = vec3(
            r2 * cos(2.0 * t2) + aOrbit.z * 0.75,
            r2 * sin(2.0 * t2) + (aSeed.z - 0.5) * 0.75,
            1.6 * sin(3.0 * t2) + (aOrbit.x - 0.5) * 0.75
          );

          // Act III: High-Velocity Vortex Tunnel Swarm
          float z3 = mod(v * 14.0 - uTime * 11.0, 28.0) - 14.0;
          float swirl = u + z3 * 0.38 + uTime * 2.2;
          float rad3 = 2.4 + 2.8 * aOrbit.x + 0.45 * sin(z3 * 0.8 + uTime * 4.0);
          vec3 p3 = vec3(
            rad3 * cos(swirl),
            rad3 * sin(swirl),
            z3
          );

          // Act IV: Zero-Gravity Ferrofluid Droplet Satellites
          float r4 = 3.1 + 2.2 * sin(aOrbit.y * 6.28 + uTime * 1.6);
          float ang4 = u + uTime * 0.55;
          vec3 p4 = vec3(
            r4 * cos(ang4),
            v * 3.8 + 0.6 * sin(u * 4.0 + uTime * 3.0),
            r4 * sin(ang4)
          );

          // Act V: Sacred Architectural Constellation Sphere
          float r5 = 3.4 + 1.8 * floor(aOrbit.x * 3.0) * 0.5;
          vec3 p5 = vec3(
            r5 * sin(phi1) * cos(u - uTime * 0.4),
            r5 * sin(phi1) * sin(u - uTime * 0.4),
            r5 * cos(phi1)
          );

          vec3 pos;
          if (uActMorph < 1.0) {
            pos = mix(p1, p2, smoothstep(0.0, 1.0, uActMorph));
          } else if (uActMorph < 2.0) {
            pos = mix(p2, p3, smoothstep(1.0, 2.0, uActMorph));
          } else if (uActMorph < 3.0) {
            pos = mix(p3, p4, smoothstep(2.0, 3.0, uActMorph));
          } else if (uActMorph < 4.0) {
            pos = mix(p4, p5, smoothstep(3.0, 4.0, uActMorph));
          } else {
            pos = mix(p5, p1, smoothstep(4.0, 5.0, uActMorph));
          }

          pos *= (1.0 + uBeatPulse * 0.08 * aOrbit.y);

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float depth = max(1.0, -mvPosition.z);
          float dofBlur = 1.0 + abs(depth - 8.5) * 0.16;
          gl_PointSize = clamp((18.0 * aScale * (1.0 + uBeatPulse * 0.45) * dofBlur) / depth, 1.5, 26.0);

          vColor = mix(uColorAccent1, uColorAccent2, aOrbit.x);
          if (aOrbit.z > 0.78) {
            vColor = uColorAccent3;
          }
          vAlpha = clamp((1.0 - abs(depth - 8.5) / 18.0) * (0.55 + 0.45 * aScale), 0.12, 0.95);
        }
      `;

      const PARTICLE_FRAGMENT = `
        precision highp float;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);

          float ring = smoothstep(0.32, 0.44, dist) * (1.0 - smoothstep(0.44, 0.5, dist)) * 0.45;
          float intensity = core + ring;

          gl_FragColor = vec4(vColor * (1.1 + core * 0.6), intensity * vAlpha);
        }
      `;

        useEffect(() => { engineStateRef.current.playbackRate = playbackRate; }, [playbackRate]);
        useEffect(() => { engineStateRef.current.showHudOverlay = showHudOverlay; }, [showHudOverlay]);

          function getInterpolatedPalette(t) {
            const scaled = (t / 3.0);
            const idxA = Math.floor(scaled) % 5;
            const idxB = (idxA + 1) % 5;
            const localT = scaled - Math.floor(scaled);
            const blend = smoothstep(0.68, 1.0, localT);

            const palA = ACTS[idxA].palette;
            const palB = ACTS[idxB].palette;

            const mixRgb = (hex1, hex2) => {
              const c1 = hexToRgb(hex1);
              const c2 = hexToRgb(hex2);
              return [
                lerp(c1[0], c2[0], blend),
                lerp(c1[1], c2[1], blend),
                lerp(c1[2], c2[2], blend)
              ];
            };

            return {
              bgA: mixRgb(palA.bgA, palB.bgA),
              bgB: mixRgb(palA.bgB, palB.bgB),
              accent1: mixRgb(palA.accent1, palB.accent1),
              accent2: mixRgb(palA.accent2, palB.accent2),
              accent3: mixRgb(palA.accent3, palB.accent3)

          // ===================================================================
          // 2D KINETIC TYPOGRAPHY, 3D VERTEX CALLOUTS & FLUID TRANSITIONS
          // ===================================================================
          function renderCompositeOverlay(ctx, t, beatPulse, transitionSurge, pal, state, cam) {
            const W = WIDTH;
            const H = HEIGHT;
            const actIdx = Math.min(4, Math.floor(t / 3.0));
            const act = ACTS[actIdx];
            const actLocalTime = t - act.start; // 0.0 -> 3.0
            const actProgress = clamp(actLocalTime / 3.0, 0.0, 1.0);

            const rgb1 = `rgb(${Math.round(pal.accent1[0] * 255)}, ${Math.round(pal.accent1[1] * 255)}, ${Math.round(pal.accent1[2] * 255)})`;
            const rgb2 = `rgb(${Math.round(pal.accent2[0] * 255)}, ${Math.round(pal.accent2[1] * 255)}, ${Math.round(pal.accent2[2] * 255)})`;

            ctx.save();

            // 1. Anamorphic Lens Flare Streak & Optical Glow
            const flareAlpha = 0.14 + beatPulse * 0.22 + transitionSurge * 0.35;
            const flareY = H * 0.5 + Math.sin(t * 1.8) * 65;
            const flareGrad = ctx.createLinearGradient(0, flareY, W, flareY);
            flareGrad.addColorStop(0.0, 'rgba(0,0,0,0)');
            flareGrad.addColorStop(0.25, `rgba(${Math.round(pal.accent2[0] * 255)}, ${Math.round(pal.accent2[1] * 255)}, ${Math.round(pal.accent2[2] * 255)}, ${flareAlpha * 0.45})`);
            flareGrad.addColorStop(0.5, `rgba(255, 255, 255, ${flareAlpha * 0.85})`);
            flareGrad.addColorStop(0.75, `rgba(${Math.round(pal.accent1[0] * 255)}, ${Math.round(pal.accent1[1] * 255)}, ${Math.round(pal.accent1[2] * 255)}, ${flareAlpha * 0.45})`);
            flareGrad.addColorStop(1.0, 'rgba(0,0,0,0)');

            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = flareGrad;
            ctx.fillRect(0, flareY - (2 + beatPulse * 5), W, 4 + beatPulse * 10);

            if (transitionSurge > 0.01) {
              ctx.save();

              ctx.rotate(t * 1.2);
              const maxR = Math.hypot(W, H) * 0.55;
              const ringR = (1.0 - Math.abs(transitionSurge - 0.5) * 1.4) * maxR * 0.72;
              ctx.strokeStyle = rgb1;
              ctx.lineWidth = 2.0 + transitionSurge * 14.0;
              ctx.globalAlpha = transitionSurge * 0.55;

                const ang = (a / 64) * Math.PI * 2.0;
                const waveR = Math.max(10, ringR + Math.sin(ang * 6.0 + t * 12.0) * 38.0 * transitionSurge);
                const px = Math.cos(ang) * waveR;
                const py = Math.sin(ang) * waveR;
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
              }
              ctx.closePath();
              ctx.stroke();

              ctx.strokeStyle = rgb2;
              ctx.lineWidth = 1.5 + transitionSurge * 6.0;
              ctx.beginPath();
              ctx.arc(0, 0, Math.max(10, ringR * 1.08), 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();

            // 3. Live 3D-to-2D Projected Motion Graphics Vertex Callouts
            if (state.showHudOverlay) {
              ctx.save();
              ctx.globalCompositeOperation = 'screen';
              const anchorLabels = [
                'VTX_01 // TOPOLOGY',
                'SHD_02 // FRESNEL',
                'PAR_03 // 12K_SWARM',
                'CAM_04 // ANAMORPHIC'
              ];
              for (let k = 0; k < 4; k++) {
                const theta = t * 0.9 + k * (Math.PI * 0.5);
                const phi = Math.sin(t * 0.7 + k * 1.4) * 0.8;
                const rad = 2.25 + beatPulse * 0.25;
                projVec.set(
                  rad * Math.cos(phi) * Math.cos(theta),
                  rad * Math.sin(phi),
                  rad * Math.cos(phi) * Math.sin(theta)

                  ctx.globalAlpha = 0.72;

                  ctx.fillStyle = '#FFFFFF';
                  ctx.textAlign = offsetDir > 0 ? 'left' : 'right';
                  ctx.fillText(
                    anchorLabels[k],
                    elbowX + offsetDir * 6,
                    elbowY - 6

                  ctx.fillStyle = k % 2 === 0 ? rgb1 : rgb2;

                  ctx.fillText(
                    `XYZ [${projVec.x.toFixed(2)}, ${projVec.y.toFixed(2)}, ${projVec.z.toFixed(2)}]`,
                    elbowX + offsetDir * 6,

            // 4. Act-Specific Kinetic Typography Compositions (Unique per Act!)

              ctx.strokeStyle = `rgba(${Math.round(pal.accent1[0] * 255)}, ${Math.round(pal.accent1[1] * 255)}, ${Math.round(pal.accent1[2] * 255)}, ${0.18 * visibility})`;
              ctx.strokeText(act.heroWord, W * 0.5 - trackingShift, H * 0.5 + 175 * (1.0 - introEase * 0.65));
            }
            ctx.restore();

            // Primary Foreground Kinetic Typography
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            const chars = act.heroWord.split('');
            const charFontSize = actIdx === 4 ? 118 : 108;
            ctx.font = `800 ${charFontSize}px ${FONT_UI}`;
            ctx.textBaseline = 'alphabetic';

            const charSpacing = 12 + actProgress * 16 + beatPulse * 5;
            let totalWidth = 0;
            const charWidths = chars.map((ch) => {
              const w = ctx.measureText(ch).width;
              totalWidth += w;
              return w;
            });
            totalWidth += Math.max(0, chars.length - 1) * charSpacing;

            let cursorX = (W - totalWidth) * 0.5;
            const baseHeroY = H * 0.80;

            for (let i = 0; i < chars.length; i++) {
              const ch = chars[i];
              const cw = charWidths[i];
              const staggerDelay = i * 0.045;
              const cIn = smoothstep(staggerDelay, staggerDelay + 0.38, actLocalTime);
              const cOut = 1.0 - smoothstep(2.55 + i * 0.02, 2.96, actLocalTime);
              const cAlpha = cIn * cOut;

              const yOffset = (1.0 - cIn) * 68 - (1.0 - cOut) * 48;
              const shear = (1.0 - cIn) * -0.25 + (1.0 - cOut) * 0.2;

              ctx.save();
              ctx.translate(cursorX + cw * 0.5, baseHeroY + yOffset);
              ctx.transform(1, 0, shear, 1, 0, 0);

              if (beatPulse > 0.35 || transitionSurge > 0.15) {
                const shift = (beatPulse * 4.5 + transitionSurge * 9.0);
                ctx.fillStyle = rgb2;
                ctx.globalAlpha = cAlpha * 0.55;
                ctx.fillText(ch, -cw * 0.5 - shift, 0);

                ctx.fillStyle = rgb1;
                ctx.fillText(ch, -cw * 0.5 + shift, 0);
              }

              ctx.globalAlpha = cAlpha;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText(ch, -cw * 0.5, 0);
              ctx.restore();

              cursorX += cw + charSpacing;

            // Subtitle under hero word
            ctx.textAlign = 'center';
            ctx.globalAlpha = visibility;
            ctx.font = '700 18px ' + FONT_MONO;
            ctx.fillStyle = rgb1;

            if (state.showHudOverlay) {

                [padXLeft, padY, 1, 1],

                ctx.moveTo(cx, cy + dy * 22);
                ctx.lineTo(cx, cy);
                ctx.lineTo(cx + dx * 22, cy);
                ctx.stroke();

              ctx.fillStyle = rgb1;
              ctx.textAlign = 'left';
              ctx.fillText('KINETIX // STUDIO SHOWREEL 2026', padXLeft + 14, padY + 24);

              ctx.font = '500 14px ' + FONT_MONO;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.68)';
              ctx.fillText(`${act.code}  ·  ${act.cameraSpec}`, padXLeft + 14, padY + 46);

              ctx.textAlign = 'right';
              ctx.font = '700 18px ' + FONT_MONO;
              ctx.fillStyle = '#FFFFFF';
              const frameNum = String(Math.min(TOTAL_FRAMES, Math.floor(t * FPS))).padStart(3, '0');
              ctx.fillText(`TC ${formatTimecode(t)}  //  FRM ${frameNum}/${TOTAL_FRAMES}`, W - padXRight - 14, padY + 24);

              ctx.font = '500 13px ' + FONT_MONO;
              ctx.fillStyle = rgb2;
              ctx.fillText(`60.0 FPS  ·  128 BPM  ·  WEBGL + GSAP`, W - padXRight - 14, padY + 46);

              // Bottom-Left Live Audio / Beat Frequency Spectrum Bars
              const barCount = 24;
              const barBaseX = padXLeft + 14;
              const barBaseY = H - padY - 18;
              for (let b = 0; b < barCount; b++) {
                const wave = Math.abs(Math.sin(t * 9.5 + b * 0.45)) * (0.35 + beatPulse * 0.65);
                const bh = 6 + wave * 34;
                ctx.fillStyle = b % 3 === 0 ? rgb1 : (b % 3 === 1 ? rgb2 : 'rgba(255,255,255,0.65)');
                ctx.fillRect(barBaseX + b * 8, barBaseY - bh, 5, bh);
              }

              // Bottom-Right 5-Act Progress Segmented Pill Matrix
              const segW = 46;
              const segGap = 8;
              const totalSegW = 5 * segW + 4 * segGap;
              const startSegX = W - padXRight - 14 - totalSegW;
              for (let a = 0; a < 5; a++) {
                const sx = startSegX + a * (segW + segGap);
                const sy = H - padY - 24;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
                ctx.fillRect(sx, sy, segW, 6);
                if (a < actIdx) {
                  ctx.fillStyle = rgb1;
                  ctx.fillRect(sx, sy, segW, 6);
                } else if (a === actIdx) {
                  ctx.fillStyle = '#FFFFFF';
                  ctx.fillRect(sx, sy, segW * actProgress, 6);
                }
                ctx.font = '600 11px ' + FONT_MONO;
                ctx.textAlign = 'center';
                ctx.fillStyle = a === actIdx ? rgb1 : 'rgba(255,255,255,0.42)';
                ctx.fillText('0' + (a + 1), sx + segW * 0.5, sy - 6);
              }

              ctx.restore();
            }

            // 6. CinemaScope 2.39:1 Anamorphic Letterbox Bars
            if (state.showLetterbox) {
              const barH = Math.round(H * 0.078);
              ctx.fillStyle = '#030306';
              ctx.fillRect(0, 0, W, barH);
              ctx.fillRect(0, H - barH, W, barH);

              ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
              ctx.fillRect(0, barH, W, 1);
              ctx.fillRect(0, H - barH - 1, W, 1);
            }

            ctx.restore();
          }

          // ===================================================================
          // 60 FPS MASTER ANIMATION LOOP
          // ===================================================================
          let rafId = null;
          let lastPerfTime = performance.now();
          let frameCounter = 0;
          let fpsTimer = performance.now();
          let lastUiSyncTime = 0;

          function animate(now) {
            rafId = requestAnimationFrame(animate);

            const dt = Math.min(0.1, (now - lastPerfTime) / 1000);
            lastPerfTime = now;

            frameCounter++;
            if (now - fpsTimer >= 500) {
              const measuredFps = Math.min(60, Math.round((frameCounter * 1000) / (now - fpsTimer)));
              setFpsCount(measuredFps);
              frameCounter = 0;
              fpsTimer = now;
            }

            const state = engineStateRef.current;

            if (state.isRewinding) {
              state.time -= dt * (state.rewindRate || 10);
              if (state.time <= 0) {
                state.time = 0.0;
                state.isRewinding = false;
                state.isPlaying = true;
                setIsRewinding(false);
                setIsPlaying(true);
                setCurrentTime(0.0);
                setActiveActIdx(0);
              }
            } else if (state.isPlaying) {
              state.time += dt * state.playbackRate;

              if (state.isRecording) {
                const pct = Math.min(100, Math.round((state.time / DURATION) * 100));
                setRecordProgress(pct);
                if (state.time >= DURATION) {
                  state.time = DURATION;
                  if (recorderRef.current && recorderRef.current.state === 'recording') {
                    recorderRef.current.stop();
                  }
                }
              } else if (state.time >= DURATION) {
                if (state.isLooping) {
                  state.time = state.time % DURATION;
                } else {
                  state.time = DURATION;
                  state.isPlaying = false;
                  setIsPlaying(false);
                }
              }
            }

            const t = clamp(state.time, 0.0, DURATION);

            if (now - lastUiSyncTime > 32) {
              lastUiSyncTime = now;
              setCurrentTime(t);
              setActiveActIdx(Math.min(4, Math.floor(t / 3.0)));
            }

            if (audioEngineRef.current) {
              audioEngineRef.current.update(t, state.isPlaying && !state.isRewinding);
            }

            masterTl.time(t);

            const beatPhase = (t % BEAT_INTERVAL) / BEAT_INTERVAL;
            const beatPulse = Math.pow(1.0 - beatPhase, 3.0);

            const distToBoundary = Math.min(t % 3.0, 3.0 - (t % 3.0));
            const transitionSurge = smoothstep(0.48, 0.0, distToBoundary);

            const pal = getInterpolatedPalette(t);

            bgUniforms.uTime.value = t;
            bgUniforms.uBeatPulse.value = beatPulse;
            bgUniforms.uTransitionSurge.value = transitionSurge;
            bgUniforms.uColorBgA.value.set(pal.bgA[0], pal.bgA[1], pal.bgA[2]);
            bgUniforms.uColorBgB.value.set(pal.bgB[0], pal.bgB[1], pal.bgB[2]);
            bgUniforms.uColorAccent1.value.set(pal.accent1[0], pal.accent1[1], pal.accent1[2]);
            bgUniforms.uColorAccent2.value.set(pal.accent2[0], pal.accent2[1], pal.accent2[2]);

            coreUniforms.uTime.value = t;
            coreUniforms.uActMorph.value = rig.actMorph;
            coreUniforms.uBeatPulse.value = beatPulse;
            coreUniforms.uLiquidFactor.value = rig.liquidFactor;
            coreUniforms.uColorAccent1.value.set(pal.accent1[0], pal.accent1[1], pal.accent1[2]);
            coreUniforms.uColorAccent2.value.set(pal.accent2[0], pal.accent2[1], pal.accent2[2]);
            coreUniforms.uColorAccent3.value.set(pal.accent3[0], pal.accent3[1], pal.accent3[2]);

            particleUniforms.uTime.value = t;
            particleUniforms.uActMorph.value = rig.actMorph;
            particleUniforms.uBeatPulse.value = beatPulse;
            particleUniforms.uColorAccent1.value.set(pal.accent1[0], pal.accent1[1], pal.accent1[2]);
            particleUniforms.uColorAccent2.value.set(pal.accent2[0], pal.accent2[1], pal.accent2[2]);
            particleUniforms.uColorAccent3.value.set(pal.accent3[0], pal.accent3[1], pal.accent3[2]);

            coreMesh.rotation.y = t * 0.55;
            coreMesh.rotation.x = Math.sin(t * 0.4) * 0.35;
            const coreBeatScale = 1.0 + beatPulse * 0.065;
            coreMesh.scale.set(coreBeatScale, coreBeatScale, coreBeatScale);

            exoMesh.scale.setScalar(rig.exoScale * (1.0 + beatPulse * 0.08));
            exoMesh.rotation.y = -t * 0.42;
            exoMesh.rotation.z = t * 0.31;
            exoMat.color.setRGB(pal.accent1[0], pal.accent1[1], pal.accent1[2]);

            for (let r = 0; r < gyroRings.length; r++) {
              const ring = gyroRings[r];
              const speed = (r + 1) * 0.35 * (r % 2 === 0 ? 1 : -1);
              ring.rotation.x = t * speed + r * 0.5;
              ring.rotation.y = t * speed * 0.8 + transitionSurge * 0.6;
              const ringScale = 1.0 + Math.sin(t * 2.0 + r) * 0.08 + beatPulse * 0.05;
              ring.scale.setScalar(ringScale);
              const colArr = r % 2 === 0 ? pal.accent1 : pal.accent2;
              ring.material.color.setRGB(colArr[0], colArr[1], colArr[2]);
            }

            monoMat.emissive.setRGB(pal.accent1[0], pal.accent1[1], pal.accent1[2]);
            monoMat.emissiveIntensity = 0.28 + beatPulse * 0.45 + transitionSurge * 0.4;
            pointLight1.color.setRGB(pal.accent1[0], pal.accent1[1], pal.accent1[2]);
            pointLight2.color.setRGB(pal.accent2[0], pal.accent2[1], pal.accent2[2]);

            for (let i = 0; i < MONOLITH_COUNT; i++) {
              const frac = i / MONOLITH_COUNT;
              const angle = frac * Math.PI * 2.0 * 4.0 + t * 0.65;
              const ringIdx = i % 8;

              const radiusBase = 3.6 + ringIdx * 0.48 + rig.monolithSpread * 1.8;
              const tunnelZ = ((frac * 22.0 - t * 6.0) % 22.0 + 22.0) % 22.0 - 11.0;
              const zPos = lerp(
                Math.sin(frac * Math.PI * 6.0 + t * 1.8) * (1.8 + rig.monolithSpread * 4.5),
                tunnelZ,
                rig.monolithSpread
              );

              const xPos = Math.cos(angle) * radiusBase;
              const yPos = Math.sin(angle) * radiusBase;

              dummyObj.position.set(xPos, yPos, zPos);
              dummyObj.lookAt(0, 0, zPos * 0.35);
              const barLen = 0.75 + Math.sin(t * 5.0 + i * 0.35) * 0.45 + beatPulse * 0.55;
              dummyObj.scale.set(1.0, 1.0, barLen);
              dummyObj.updateMatrix();
              monolithInstanced.setMatrixAt(i, dummyObj.matrix);
            }
            monolithInstanced.instanceMatrix.needsUpdate = true;

            const az = rig.camAzimuth + (state.cameraMode === 'interactive' ? state.userYaw : 0);
            const el = clamp(
              rig.camElevation + (state.cameraMode === 'interactive' ? state.userPitch : 0),
              -1.2,
              1.2
            );
            const dist = clamp(rig.camDist + state.userZoom - transitionSurge * 0.85, 3.5, 16.0);

            camera.fov = rig.camFov + beatPulse * 2.2 + transitionSurge * 8.0;
            camera.updateProjectionMatrix();

            camera.position.x = dist * Math.cos(el) * Math.sin(az);
            camera.position.y = dist * Math.sin(el);
            camera.position.z = dist * Math.cos(el) * Math.cos(az);
            camera.lookAt(0, 0, 0);
            camera.rotation.z += rig.camRoll + Math.sin(t * 1.5) * 0.04;
            camera.updateMatrixWorld();

            if (renderer) {
              renderer.render(scene, camera);
            }

            ctx.save();
            const lutObj = LUT_PRESETS.find((l) => l.id === state.selectedLut) || LUT_PRESETS[0];
            if (lutObj.id !== 'studio') {
              ctx.filter = `saturate(${lutObj.saturation}) contrast(${lutObj.contrast}) hue-rotate(${lutObj.hueShift}deg)`;
            } else {
              ctx.filter = 'none';
            }

            if (renderer) {
              ctx.drawImage(webglCanvas, 0, 0, WIDTH, HEIGHT);
            } else {
              // Software fallback background if WebGL context is unavailable in headless environment
              const grad = ctx.createRadialGradient(WIDTH * 0.5, HEIGHT * 0.5, 50, WIDTH * 0.5, HEIGHT * 0.5, WIDTH * 0.65);
              grad.addColorStop(0, `rgb(${Math.round(pal.bgB[0]*255)}, ${Math.round(pal.bgB[1]*255)}, ${Math.round(pal.bgB[2]*255)})`);
              grad.addColorStop(1, `rgb(${Math.round(pal.bgA[0]*255)}, ${Math.round(pal.bgA[1]*255)}, ${Math.round(pal.bgA[2]*255)})`);
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }
            ctx.filter = 'none';

            renderCompositeOverlay(ctx, t, beatPulse, transitionSurge, pal, state, camera);
            ctx.restore();
          }

          rafId = requestAnimationFrame(animate);

          return () => {
            if (rafId) cancelAnimationFrame(rafId);
            masterTl.kill();
            if (renderer) renderer.dispose();
          };
        }, []);

        const handleStageMouseDown = useCallback((e) => {
          engineStateRef.current.isDraggingStage = true;
          engineStateRef.current.dragStartX = e.clientX;
          engineStateRef.current.dragStartY = e.clientY;
        }, []);

        const handleStageMouseMove = useCallback((e) => {
          if (!engineStateRef.current.isDraggingStage) return;
          const dx = e.clientX - engineStateRef.current.dragStartX;
          const dy = e.clientY - engineStateRef.current.dragStartY;
          engineStateRef.current.dragStartX = e.clientX;
          engineStateRef.current.dragStartY = e.clientY;
          engineStateRef.current.userYaw -= dx * 0.007;
          engineStateRef.current.userPitch = clamp(engineStateRef.current.userPitch + dy * 0.006, -0.9, 0.9);
          if (cameraMode !== 'interactive') {
            setCameraMode('interactive');
          }
        }, [cameraMode]);

        const handleStageMouseUp = useCallback(() => {
          engineStateRef.current.isDraggingStage = false;
        }, []);

        const jumpToAct = useCallback((idx) => {
          const act = ACTS[idx];
          if (!act) return;
          seekTo(act.start + 0.02);
        }, [seekTo]);

        const cycleAct = useCallback(() => {
          jumpToAct((activeActIdx + 1) % ACTS.length);
        }, [activeActIdx, jumpToAct]);

        const cycleLut = useCallback(() => {
          const idx = LUT_PRESETS.findIndex((lut) => lut.id === selectedLut);
          const next = LUT_PRESETS[(idx + 1 + LUT_PRESETS.length) % LUT_PRESETS.length];
          setSelectedLut(next.id);
        }, [selectedLut]);

        const formatSpeedLabel = useCallback((rate) => {
          const normalized = Number.isInteger(rate) ? String(rate) : String(rate);
          return `${normalized}x`;
        }, []);

        const toggleSpeedMenu = useCallback(() => {
          setSpeedMenuOpen((open) => !open);
        }, []);

        const pickSpeed = useCallback((rate) => {
          setPlaybackRate(rate);
          setSpeedMenuOpen(false);
        }, []);

        const toggleCameraMode = useCallback(() => {
          if (cameraMode === 'interactive') {
            engineStateRef.current.userYaw = 0;
            engineStateRef.current.userPitch = 0;
            engineStateRef.current.userZoom = 0;
            setCameraMode('director');
          } else {
            setCameraMode('interactive');
          }
        }, [cameraMode]);

        useEffect(() => {
          if (prevActIdxRef.current === activeActIdx) return;
          prevActIdxRef.current = activeActIdx;
          setSwitchPulse((v) => v + 1);
        }, [activeActIdx]);

        const activeAct = ACTS[activeActIdx] || ACTS[0];

        const iconBtn = (opts) => h('button', {
          type: 'button',
          'aria-label': opts.title,
          onClick: opts.onClick,
          onMouseEnter: (e) => {
            // Prevent host/browser native title tooltips from appearing
            if (e.currentTarget.getAttribute('title')) {
              e.currentTarget.removeAttribute('title');
            }
          },
          className: `icon-btn ${opts.on ? 'is-on' : ''} ${opts.danger ? 'is-danger' : ''}`.trim()
        },
          Icon({ d: opts.icon }),
          opts.tip === false
            ? null
            : h('span', { className: 'kx-tip', 'aria-hidden': true }, opts.title)
        );

        return h('div', {
          className: 'relative h-[100dvh] w-full overflow-hidden bg-black text-[#F4F4F6] select-none',
          onMouseUp: handleStageMouseUp,
          onClick: () => {
            if (speedMenuOpen) setSpeedMenuOpen(false);
          }
        },
          h('canvas', {
            id: 'master-stage',
            ref: masterCanvasRef,
            width: 1920,
            height: 1080,
            onMouseDown: handleStageMouseDown,
            onMouseMove: handleStageMouseMove,
            className: 'absolute inset-0 h-full w-full object-cover cursor-grab active:cursor-grabbing block bg-black'
          }),

          h('div', {
            key: `flash-${switchPulse}`,
            className: `act-flash ${switchPulse > 0 ? 'is-on' : ''}`
          }),

          h('div', {
            className: 'absolute top-4 left-4 z-30 flex items-center gap-3 pointer-events-none'
          },
            h('img', {
              src: './assets/brand/logo.png',
              alt: 'KINETIX',
              width: 44,
              height: 44,
              className: 'w-11 h-11 rounded-xl object-cover border border-[#D4FF00]/35 shadow-[0_0_24px_rgba(212,255,0,0.28)] bg-black'
            }),
            h('div', { className: 'hidden sm:block' },
              h('div', { className: 'font-display font-bold text-sm tracking-[0.14em] text-white/95' }, 'KINETIX'),
              h('div', { className: 'font-mono-tech text-[10px] text-zinc-400' }, `${fpsCount} FPS · 15.0s`)
            )
          ),

          isRecording && h('div', {
            className: 'absolute top-4 left-1/2 -translate-x-1/2 z-40 px-4 py-1.5 rounded-full bg-[#FF1E56]/90 text-white font-mono-tech text-xs font-bold flex items-center gap-2'
          },
            h('span', { className: 'w-2 h-2 rounded-full bg-white rec-dot' }),
            `REC ${recordProgress}% · ${formatTimecode(currentTime)}`
          ),

          h('div', {
            className: 'absolute top-4 right-4 z-40 icon-rail glass-panel'
          },
            iconBtn({
              title: isPlaying ? '暫停' : '播放',
              icon: isPlaying ? ICONS.pause : ICONS.play,
              on: isPlaying,
              onClick: handleTogglePlay
            }),
            iconBtn({
              title: isRewinding ? '倒轉中…' : '加速倒轉重播',
              icon: ICONS.restart,
              on: isRewinding,
              onClick: handleRestart
            }),
            iconBtn({
              title: audioEnabled ? '關閉音軌' : '開啟音軌',
              icon: audioEnabled ? ICONS.audioOn : ICONS.audioOff,
              on: audioEnabled,
              onClick: handleToggleAudio
            }),
            iconBtn({
              title: cameraMode === 'director' ? '切換自由視角' : '重置導演運鏡',
              icon: ICONS.camera,
              on: cameraMode !== 'director',
              onClick: toggleCameraMode
            }),
            iconBtn({
              title: showHudOverlay ? '關閉 HUD' : '開啟 HUD',
              icon: ICONS.hud,
              on: showHudOverlay,
              onClick: () => setShowHudOverlay((v) => !v)
            }),
            iconBtn({
              title: showLetterbox ? '關閉遮幅' : '開啟遮幅',
              icon: ICONS.frame,
              on: showLetterbox,
              onClick: () => setShowLetterbox((v) => !v)
            }),
            iconBtn({
              title: '下一段落',
              icon: ICONS.acts,
              tip: false,
              onClick: cycleAct
            }),
            h('div', {
              className: 'relative',
              onClick: (e) => e.stopPropagation()
            },
              h('button', {
                type: 'button',
                'aria-label': `播放速度 ${formatSpeedLabel(playbackRate)}`,
                'aria-expanded': speedMenuOpen,
                onClick: toggleSpeedMenu,
                className: `icon-btn speed-btn ${playbackRate !== 1 || speedMenuOpen ? 'is-on' : ''}`.trim()
              }, formatSpeedLabel(playbackRate)),
              speedMenuOpen && h('div', {
                className: 'speed-menu',
                role: 'menu',
                'aria-label': '選擇播放速度 0.5x 到 2x'
              },
                SPEED_PRESETS.map((rate) =>
                  h('button', {
                    key: rate,
                    type: 'button',
                    role: 'menuitemradio',
                    'aria-checked': playbackRate === rate,
                    className: `speed-option ${playbackRate === rate ? 'is-active' : ''}`,
                    onClick: () => pickSpeed(rate)
                  }, formatSpeedLabel(rate))
                )
              )
            ),
            iconBtn({
              title: `調色 · ${(LUT_PRESETS.find((lut) => lut.id === selectedLut) || LUT_PRESETS[0]).name}`,
              icon: ICONS.settings,
              on: selectedLut !== 'studio',
              onClick: cycleLut
            }),
            iconBtn({
              title: isRecording ? '結束錄製' : '匯出 15s 影片',
              icon: ICONS.export,
              on: isRecording,
              danger: isRecording,
              onClick: isRecording ? handleStopRecordingEarly : handleStartVideoExport
            })
          ),

          exportModalOpen && h('div', {
            className: 'fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4'
          },
            h('div', {
              className: 'glass-panel max-w-md w-full rounded-2xl p-6 border border-white/20 flex flex-col gap-4 shadow-2xl'
            },
              h('div', { className: 'flex items-center justify-between' },
                h('span', { className: 'font-mono-tech text-xs font-bold text-[#D4FF00]' }, 'STUDIO RENDER // VIDEO EXPORT'),
                h('button', {
                  type: 'button',
                  onClick: () => setExportModalOpen(false),
                  className: 'icon-btn',
                  'aria-label': '關閉'
                },
                  Icon({ d: ICONS.close, size: 16 }),
                  h('span', { className: 'kx-tip', 'aria-hidden': true }, '關閉')
                )
              ),
              exportedVideoUrl
                ? h('div', { className: 'flex flex-col gap-3' },
                    h('h3', { className: 'font-display font-bold text-lg text-white' }, '15 秒動態作品影片匯出完成！'),
                    h('p', { className: 'text-xs text-zinc-300 leading-relaxed' },
                      `已將 1920×1080 60FPS 合成畫布完整錄製為影片檔 (${exportedFileName})。`
                    ),
                    h('video', {
                      src: exportedVideoUrl,
                      controls: true,
                      autoPlay: true,
                      loop: true,
                      className: 'w-full rounded-xl border border-white/15 bg-black aspect-video'
                    }),
                    h('div', { className: 'flex items-center justify-end gap-2 pt-2' },
                      h('a', {
                        href: exportedVideoUrl,
                        download: exportedFileName || 'KINETIX_Showreel_2026.webm',
                        className: 'px-4 py-2 rounded-xl font-mono-tech text-xs font-bold bg-[#D4FF00] text-black hover:bg-[#e5ff55] transition'
                      }, '下載影片檔'),
                      h('button', {
                        type: 'button',
                        onClick: () => setExportModalOpen(false),
                        className: 'px-4 py-2 rounded-xl font-mono-tech text-xs bg-white/10 text-white hover:bg-white/15 transition'
                      }, '返回舞台')
                    )
                  )
                : h('div', { className: 'flex flex-col gap-3' },
                    h('h3', { className: 'font-display font-bold text-lg text-white' }, '瀏覽器環境錄製提示'),
                    h('p', { className: 'text-xs text-zinc-300 leading-relaxed' },
                      '請於標準桌面瀏覽器中使用匯出功能，以擷取 1080p 60FPS 串流。'
                    ),
                    h('button', {
                      type: 'button',
                      onClick: () => setExportModalOpen(false),
                      className: 'self-end px-4 py-2 rounded-xl font-mono-tech text-xs bg-[#D4FF00] text-black font-bold'
                    }, '了解')
                  )
            )
          )
        );
      }

      const rootEl = document.getElementById('root');
      if (rootEl) {
        const root = ReactDOM.createRoot(rootEl);
        root.render(h(App));
      }
    })();
  </script>
</body>
